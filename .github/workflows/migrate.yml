name: migrate
on:
  workflow_dispatch:
    inputs:
      fail:
        description: Simulate a failed migration
        type: boolean
        default: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "mock migration"
          sleep 20
          if [ "${{ inputs.fail }}" = true ]; then echo "migration failed"; exit 1; fi
          echo "migration done"