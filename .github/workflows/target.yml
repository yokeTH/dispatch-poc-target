name: target
on:
  workflow_call:
    inputs:
      message:
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the mock build artifact
        value: ${{ jobs.build.outputs.artifact }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.mock.outputs.artifact }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yokeTH/dispatch-poc-target
          ref: main
          token: ${{ secrets.TARGET_READ_TOKEN }}
      - run: cat message.txt
      - id: mock
        run: |
          echo "mock build: ${{ inputs.message }}"
          sleep 5
          echo "artifact=app-${{ github.sha }}" >> "$GITHUB_OUTPUT"
