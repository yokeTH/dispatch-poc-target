name: target
on:
  workflow_call:
    inputs:
      message:
        type: string
        required: true
    outputs:
      artifact:
        description: Name of the mock build artifact
        value: ${{ jobs.build.outputs.artifact }}
jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact: ${{ steps.mock.outputs.artifact }}
    steps:
      - id: mock
        run: |
          echo "mock build: ${{ inputs.message }}"
          sleep 5
          echo "artifact=app-${{ github.sha }}" >> "$GITHUB_OUTPUT"
